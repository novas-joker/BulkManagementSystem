version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mailforge-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-mailforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailforge_dev}
      POSTGRES_DB: ${DB_NAME:-mailforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mailforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mailforge

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: mailforge-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mailforge

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mailforge-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mailforge}:${DB_PASSWORD:-mailforge_dev}@postgres:5432/${DB_NAME:-mailforge}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: ${SMTP_HOST:-smtp.zoho.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - mailforge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker for async email delivery
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mailforge-celery-worker
    command: celery -A app.workers worker -l info --concurrency=4
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mailforge}:${DB_PASSWORD:-mailforge_dev}@postgres:5432/${DB_NAME:-mailforge}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: ${SMTP_HOST:-smtp.zoho.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app
    networks:
      - mailforge

  # Celery Beat for scheduled campaigns
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mailforge-celery-beat
    command: celery -A app.workers beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mailforge}:${DB_PASSWORD:-mailforge_dev}@postgres:5432/${DB_NAME:-mailforge}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: ${SMTP_HOST:-smtp.zoho.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app
    networks:
      - mailforge

  # React Frontend (built for production)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mailforge-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - mailforge
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  mailforge:
    driver: bridge
